<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BarrWood">
  <meta name="theme-color" content="#0f2744">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>BarrWood Services</title>
  <style>
    :root {
      --navy: #060f1e;
      --blue: #1248a0;
      --blue-mid: #1a5ea8;
      --blue-light: #4da3e8;
      --green: #2e9e52;
      --green-light: #3dbf65;
      --green-pale: #0a2a14;
      --blue-pale: #102a50;
      --surface: #0c1e38;
      --card: #0e2444;
      --border: #2a5a8c;
      --text: #e0eeff;
      --text-mid: #7aaed4;
      --text-light: #3d6a90;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(180deg, #0a1e3a 0%, #0e2a50 100%); color: var(--text); max-width: 600px; margin: 0 auto; min-height: 100vh; }

    #app-header { background: linear-gradient(160deg, #060f1e 0%, #1248a0 60%, #1a5ea8 100%); position: sticky; top: 0; z-index: 100; box-shadow: 0 3px 20px rgba(0,0,0,.6); }
    .header-inner { padding: 14px 16px 0; }
    .header-top { display: flex; align-items: center; gap: 14px; padding-bottom: 10px; }
    .logo-circle { width: 62px; height: 62px; border-radius: 14px; flex-shrink: 0; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.15); overflow: hidden; }
    .logo-circle img { width: 60px; height: 60px; object-fit: cover; }
    .brand { flex: 1; }
    .brand-name { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: -0.5px; line-height: 1.1; }
    .brand-sub { font-size: 11px; color: rgba(255,255,255,.45); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 2px; }
    .header-btns { display: flex; gap: 8px; flex-shrink: 0; }
    #btn-new { background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.2); color: rgba(255,255,255,.85); border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    #btn-export { background: linear-gradient(135deg, var(--green) 0%, var(--green-light) 100%); border: none; color: #fff; border-radius: 10px; padding: 9px 18px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit; box-shadow: 0 2px 8px rgba(46,158,82,.4); }
    .header-bar { background: rgba(0,0,0,.2); border-top: 1px solid rgba(255,255,255,.08); padding: 7px 16px; display: flex; align-items: center; gap: 8px; }
    #item-count { font-size: 12px; color: rgba(255,255,255,.5); flex: 1; }
    .header-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-light); display: none; }
    .header-dot.on { display: inline-block; }

    #page { padding: 12px 10px 70px; }

    .card { background: var(--card); border-radius: 14px; margin-bottom: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.4); border: 2px solid var(--border); overflow: hidden; }
    .acc-head { display: flex; align-items: center; width: 100%; background: none; border: none; padding: 14px 16px; cursor: pointer; gap: 12px; text-align: left; border-left: 4px solid transparent; transition: background 0.15s; }
    .acc-head:active { background: rgba(255,255,255,.05); }
    .acc-head.open { border-left-color: var(--blue-mid); background: linear-gradient(90deg, rgba(26,94,168,.15) 0%, transparent 100%); }
    .acc-num { font-size: 12px; font-weight: 900; color: var(--blue-light); background: rgba(26,94,168,.25); border-radius: 8px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1.5px solid rgba(77,163,232,.3); }
    .acc-label { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }
    .acc-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .badge { background: linear-gradient(135deg, var(--blue) 0%, var(--blue-light) 100%); color: #fff; border-radius: 10px; padding: 2px 9px; font-size: 11px; font-weight: 800; display: none; }
    .chevron { font-size: 13px; color: var(--text-light); }
    .acc-body { border-top: 1px solid var(--border); display: none; }
    .acc-body.open { display: block; }
    .sec-body { padding: 14px 16px 16px; }

    .row { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-end; }
    .col { display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .col.flex2 { flex: 2; }
    .field-label { font-size: 11px; font-weight: 700; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.07em; }
    input[type=text], input[type=email], input[type=date], input[type=number], select, .sqft-display {
      border: 2.5px solid var(--border); border-radius: 10px; padding: 11px 12px;
      font-size: 14px; color: var(--text); background: #122b52;
      outline: none; width: 100%; font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus { border-color: var(--blue-light); box-shadow: 0 0 0 3px rgba(77,163,232,.2); }
    .sqft-display { color: var(--text-light); display: flex; align-items: center; min-height: 44px; }
    .sqft-display.has-val { background: #0a2a14; color: var(--green-light); font-weight: 700; border-color: #2e9e52; }
    .math-sym { padding-top: 24px; color: var(--text-light); font-size: 18px; flex-shrink: 0; }
    #f-estimate { border-color: #a07010; background: #1a1200; font-weight: 700; font-size: 15px; color: #ffc040; }
    .est-required { font-size: 11px; color: #d97706; margin-top: 3px; display: none; }
    .est-required.show { display: block; }

    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .chip { border: 2px solid var(--border); border-radius: 20px; padding: 7px 14px; font-size: 13px; cursor: pointer; background: #122b52; color: var(--text-mid); font-family: inherit; line-height: 1; font-weight: 500; transition: all 0.15s; }
    .chip:active { transform: scale(0.96); }
    .chip.on { background: linear-gradient(135deg, var(--blue) 0%, var(--blue-mid) 100%); color: #fff; border-color: transparent; box-shadow: 0 2px 8px rgba(18,72,160,.5); }
    .chip.green-chip.on { background: linear-gradient(135deg, var(--green) 0%, var(--green-light) 100%); box-shadow: 0 2px 8px rgba(46,158,82,.4); }

    .prep-chip { border: 2px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 13px; cursor: pointer; background: #122b52; color: var(--text-mid); font-family: inherit; text-align: left; width: 100%; margin-bottom: 7px; transition: all 0.15s; }
    .prep-chip.on { background: linear-gradient(135deg, #060f1e 0%, var(--blue) 100%); color: #fff; border-color: transparent; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
    .prep-price { font-weight: 800; font-size: 14px; display: block; }
    .prep-note { font-size: 11px; opacity: 0.65; margin-top: 3px; display: none; }
    .prep-chip.on .prep-note { display: block; }
    .prep-price-edit { width: 90px; border: 1.5px solid rgba(255,255,255,.3); border-radius: 7px; padding: 4px 8px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,.1); color: #fff; outline: none; font-family: inherit; margin-top: 4px; display: none; }
    .prep-chip.on .prep-price-edit { display: inline-block; }

    .sub-section { background: #0c1e38; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; border: 2px solid var(--border); }
    .sub-label { font-size: 11px; font-weight: 800; color: var(--blue-light); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
    .door-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .door-type-label { flex: 1; font-size: 13px; font-weight: 600; color: var(--text); }
    .door-qty { width: 62px; border: 2px solid var(--border); border-radius: 9px; padding: 8px; font-size: 13px; text-align: center; background: #122b52; color: var(--text); outline: none; font-family: inherit; }
    .door-color { width: 90px; border: 2px solid var(--border); border-radius: 9px; padding: 8px; font-size: 12px; background: #122b52; color: var(--text); outline: none; font-family: inherit; }

    .item-row { background: #122b52; border-radius: 11px; padding: 11px 13px; margin-bottom: 8px; border: 2px solid var(--border); box-shadow: 0 1px 6px rgba(0,0,0,.3); }
    .item-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .item-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); }
    .item-unit { font-size: 10px; color: var(--text-light); font-weight: 500; }
    .item-name-input { flex: 1; border: 2px solid var(--border); border-radius: 8px; padding: 8px; font-size: 14px; background: #0c1e38; color: var(--text); outline: none; font-family: inherit; }
    .qty-input { width: 66px; border: 2px solid var(--border); border-radius: 8px; padding: 8px; font-size: 14px; text-align: center; background: #0c1e38; color: var(--text); outline: none; font-family: inherit; flex-shrink: 0; }
    .note-input { width: 100%; border: 2px solid var(--border); border-radius: 8px; padding: 8px 11px; font-size: 13px; color: var(--text-mid); background: #0c1e38; outline: none; font-family: inherit; }
    .rm-btn { background: none; border: none; color: #2a4a6a; cursor: pointer; font-size: 20px; padding: 0 2px; flex-shrink: 0; line-height: 1; }
    .add-btn { background: #0c1e38; border: 2px dashed var(--border); border-radius: 10px; padding: 9px 14px; color: var(--text-light); cursor: pointer; font-size: 13px; margin-top: 4px; font-family: inherit; font-weight: 500; width: 100%; text-align: center; }

    .section-divider { font-size: 10px; font-weight: 800; color: var(--blue-light); text-transform: uppercase; letter-spacing: 0.1em; margin: 16px 0 10px; display: flex; align-items: center; gap: 8px; }
    .section-divider::before, .section-divider::after { content: ''; flex: 1; height: 1px; }
    .section-divider::after { background: linear-gradient(90deg, rgba(77,163,232,.4), transparent); }
    .section-divider::before { background: linear-gradient(90deg, transparent, rgba(77,163,232,.4)); }

    .spec-box { background: #0c1e38; border-radius: 12px; padding: 14px; margin-top: 8px; border: 2px solid var(--border); }
    .spec-row { margin-bottom: 12px; }
    .spec-row:last-child { margin-bottom: 0; }
    .spec-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

    .sub-options { background: #0c1e38; border-radius: 10px; padding: 10px 12px; margin-top: 6px; border: 2px solid var(--border); }
    .sub-options .field-label { margin-bottom: 6px; display: block; }
    .qty-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .qty-row .field-label { flex: 1; margin-bottom: 0; }
    .qty-row input { width: 70px; flex-shrink: 0; }

    .notes-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .note-card { background: var(--card); border-radius: 14px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.3); border: 2px solid var(--border); }
    .note-card-label { font-size: 11px; font-weight: 800; color: var(--blue-light); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .note-area { width: 100%; border: 2px solid var(--border); border-radius: 9px; padding: 10px; font-size: 13px; color: var(--text); background: #122b52; resize: vertical; min-height: 90px; outline: none; font-family: inherit; }

    .photo-section { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 2px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    .photo-section-label { font-size: 11px; font-weight: 800; color: var(--blue-light); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
    .photo-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .photo-thumb { width: 80px; height: 80px; border-radius: 9px; object-fit: cover; border: 1.5px solid var(--border); cursor: pointer; }
    #photo-add-btn { border: 2px dashed var(--border); border-radius: 9px; width: 80px; height: 80px; background: #122b52; cursor: pointer; font-size: 28px; color: var(--text-light); display: flex; align-items: center; justify-content: center; font-family: inherit; flex-shrink: 0; }
    #photo-input { display: none; }

    #export-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 999; align-items: flex-end; justify-content: center; }
    #export-overlay.open { display: flex; }
    #export-modal { background: #0e2444; border-radius: 22px 22px 0 0; width: 100%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; border-top: 1px solid var(--border); }
    .modal-head { padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #060f1e 0%, var(--blue) 100%); border-radius: 22px 22px 0 0; }
    .modal-head span { font-weight: 800; font-size: 16px; color: #fff; }
    .modal-close { background: rgba(255,255,255,.12); border: none; font-size: 18px; color: #fff; cursor: pointer; border-radius: 8px; padding: 3px 10px; }
    .modal-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
    .modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
    .email-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 12px; }
    .email-row .col { flex: 1; }
    #btn-send-email { background: linear-gradient(135deg, var(--green) 0%, var(--green-light) 100%); border: none; border-radius: 10px; padding: 11px 16px; color: #fff; cursor: pointer; font-size: 14px; font-weight: 800; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
    #btn-copy { width: 100%; background: linear-gradient(135deg, #060f1e 0%, var(--blue) 100%); border: none; border-radius: 10px; padding: 13px; color: #fff; cursor: pointer; font-size: 14px; font-weight: 800; margin-bottom: 12px; font-family: inherit; }
    #btn-copy.copied { background: linear-gradient(135deg, var(--green) 0%, var(--green-light) 100%); }
    #export-pre { background: #0c1e38; border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 12px; line-height: 1.9; white-space: pre-wrap; color: var(--text-mid); font-family: monospace; }
    .modal-cancel { background: #122b52; border: 2px solid var(--border); border-radius: 10px; padding: 11px 24px; cursor: pointer; font-size: 14px; font-family: inherit; color: var(--text-mid); font-weight: 600; }
    .photo-preview-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .photo-preview-grid img { width: 90px; height: 90px; border-radius: 8px; object-fit: cover; border: 1.5px solid var(--border); }

    #exit-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 9999; align-items: center; justify-content: center; }
    #exit-overlay.open { display: flex; }
    .exit-modal { background: #0e2444; border-radius: 18px; padding: 28px 24px; width: 88%; max-width: 360px; text-align: center; border: 1px solid var(--border); }
    .exit-modal h3 { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .exit-modal p { font-size: 14px; color: var(--text-mid); margin-bottom: 22px; line-height: 1.5; }
    .exit-btns { display: flex; gap: 10px; }
    .exit-btn-stay { flex: 1; background: #122b52; border: 2px solid var(--border); border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; color: var(--text-mid); }
    .exit-btn-leave { flex: 1; background: linear-gradient(135deg, #dc2626, #ef4444); border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; color: #fff; }

    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
    .shake { animation: shake 0.4s ease; border-color: #ef4444 !important; background: #2a0a0a !important; }
  </style>
</head>
<body>

<div id="app-header">
  <div class="header-inner">
    <div class="header-top">
      <div class="logo-circle"><img id="logo-img" alt="BarrWood"></div>
      <div class="brand">
        <div class="brand-name">BarrWood Services</div>
        <div class="brand-sub">Refurb Walk-Through v2</div>
      </div>
      <div class="header-btns">
        <button id="btn-new">New</button>
        <button id="btn-export">Export &rarr;</button>
      </div>
    </div>
  </div>
  <div class="header-bar">
    <span class="header-dot" id="header-dot"></span>
    <span id="item-count"></span>
  </div>
</div>

<div id="page"></div>

<!-- Exit confirmation -->
<div id="exit-overlay">
  <div class="exit-modal">
    <h3>Exit Walk-Through?</h3>
    <p>You have unsaved progress. Leaving now will lose all data for this estimate.</p>
    <div class="exit-btns">
      <button class="exit-btn-stay" id="exit-stay">Stay</button>
      <button class="exit-btn-leave" id="exit-leave">Exit</button>
    </div>
  </div>
</div>

<!-- Export modal -->
<div id="export-overlay">
  <div id="export-modal">
    <div class="modal-head"><span>Walk-Through Summary</span><button class="modal-close" id="btn-close-export">&times;</button></div>
    <div class="modal-body">
      <div class="email-row">
        <div class="col"><span class="field-label">Send to</span><input type="email" id="email-to" value="info@barrwoodservices.com"></div>
        <button id="btn-send-email">Send Email</button>
      </div>
      <button id="btn-copy">Copy to clipboard</button>
      <div id="export-photo-section" style="display:none;margin-bottom:12px;">
        <div class="field-label" style="margin-bottom:6px;">Attached Photos</div>
        <div class="photo-preview-grid" id="export-photo-grid"></div>
        <div style="font-size:11px;color:var(--text-light);margin-top:4px;">Photos attach when sharing via email app</div>
      </div>
      <pre id="export-pre"></pre>
    </div>
    <div class="modal-foot"><button class="modal-cancel" id="btn-close-export2">Close</button></div>
  </div>
</div>

<input type="file" id="photo-input" accept="image/*" multiple>

<script>

// ── Photo handling ─────────────────────────────────────────────────────────────
document.getElementById('photo-input').addEventListener('change', function(e) {
  var files = Array.prototype.slice.call(e.target.files);
  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      photos.push({ id:uid(), src:ev.target.result, name:file.name });
      renderPhotoSection();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});

function renderPhotoSection() {
  var grid = document.getElementById('photo-grid');
  if (!grid) return;
  grid.innerHTML = '';
  photos.forEach(function(p) {
    var wrap = document.createElement('div'); wrap.className = 'photo-rm'; wrap.style.position = 'relative'; wrap.style.display = 'inline-block';
    var img = document.createElement('img'); img.className = 'photo-thumb'; img.src = p.src;
    var rmBtn = document.createElement('div');
    rmBtn.style.cssText = 'position:absolute;top:-5px;right:-5px;background:#ef4444;color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;font-weight:800;';
    rmBtn.innerHTML = '&times;';
    rmBtn.addEventListener('click', function() { photos = photos.filter(function(x){ return x.id !== p.id; }); renderPhotoSection(); });
    wrap.appendChild(img); wrap.appendChild(rmBtn); grid.appendChild(wrap);
  });
  hasProgress = true;
}

// ── Render ─────────────────────────────────────────────────────────────────────
function render() {
  var page = document.getElementById('page');
  page.innerHTML = '';
  SECTIONS.forEach(function(sec) { page.appendChild(makeCard(sec)); });

  // Photo section
  var ps = document.createElement('div'); ps.className = 'photo-section';
  ps.innerHTML = '<div class="photo-section-label">Photos</div><div class="photo-grid"><div id="photo-grid"></div><button id="photo-add-btn">+</button></div>';
  page.appendChild(ps);
  document.getElementById('photo-add-btn').addEventListener('click', function(){ document.getElementById('photo-input').click(); });
  renderPhotoSection();

  // Notes
  var nr = document.createElement('div'); nr.className = 'notes-row';
  nr.innerHTML = '<div class="note-card"><div class="note-card-label">Interior Notes</div><textarea class="note-area" id="interior-notes" placeholder="Observations, special instructions..."></textarea></div>' +
    '<div class="note-card"><div class="note-card-label">Exterior Notes</div><textarea class="note-area" id="exterior-notes" placeholder="Curb appeal, exterior items..."></textarea></div>';
  page.appendChild(nr);
  document.getElementById('interior-notes').value = job.interiorNotes;
  document.getElementById('exterior-notes').value = job.exteriorNotes;
  document.getElementById('interior-notes').addEventListener('input', function(e){ job.interiorNotes = e.target.value; hasProgress=true; });
  document.getElementById('exterior-notes').addEventListener('input', function(e){ job.exteriorNotes = e.target.value; hasProgress=true; });
  updateCount();
}

function makeCard(sec) {
  var card = document.createElement('div'); card.className = 'card';
  var isOpen = !!openSections[sec.key];
  var head = document.createElement('button');
  head.className = 'acc-head' + (isOpen ? ' open' : '');
  head.innerHTML = '<span class="acc-num">' + sec.num + '</span><span class="acc-label">' + sec.label + '</span>' +
    '<span class="acc-right"><span class="badge" id="badge-' + sec.key + '"></span><span class="chevron">' + (isOpen ? '&#9652;' : '&#9662;') + '</span></span>';
  head.addEventListener('click', function(){ toggleSec(sec.key, card); });
  card.appendChild(head);
  var body = document.createElement('div'); body.className = 'acc-body' + (isOpen ? ' open' : ''); body.id = 'body-' + sec.key;
  var sb = document.createElement('div'); sb.className = 'sec-body';
  if      (sec.type === 'jobinfo')   sb.appendChild(makeJobInfo());
  else if (sec.type === 'painting')  sb.appendChild(makePainting(sec));
  else if (sec.type === 'wallprep')  sb.appendChild(makeWallPrep(sec));
  else if (sec.type === 'doors')     sb.appendChild(makeDoors(sec));
  else if (sec.type === 'piecework') sb.appendChild(makePiecework(sec));
  else if (sec.type === 'exterior')  sb.appendChild(makeExterior(sec));
  else                                sb.appendChild(makeGeneric(sec));
  body.appendChild(sb); card.appendChild(body);
  updateBadgeEl(sec.key);
  return card;
}

  wrap.querySelector('#f-estimate').addEventListener('input', function(e){ job.estimate=e.target.value.trim(); hasProgress=true; document.getElementById('est-warn').classList.remove('show'); });
  wrap.querySelector('#f-address').addEventListener('input', function(e){ job.address=e.target.value; hasProgress=true; updateCount(); });

function rerenderSqft() {
  var sqft=(job.length&&job.width)?Math.round(parseFloat(job.length)*parseFloat(job.width)):null;
  var el=document.getElementById('sqft-display');

function makeGeneric(sec) {
  // split on __DIV__ markers
  var groups=[]; var cur={label:null,items:[]};

    if(item.n && item.n.slice(0,7)==='__DIV__'){

// ── makeChipsAndRows ───────────────────────────────────────────────────────────
function makeChipsAndRows(sec) {
  var wrap=document.createElement('div');
  var rows=sectionData[sec.key]||[];
  var chipRow=document.createElement('div');chipRow.className='chip-row';
  sec.items.filter(function(i){return !i.n||i.n.slice(0,7)!=='__DIV__';}).forEach(function(item){
    var active=rows.some(function(r){return r.name===item.n;});
    var chip=document.createElement('button');chip.className='chip'+(active?' on':'');chip.textContent=(active?'\u2713 ':'')+item.n;
    chip.addEventListener('click',function(){toggleItem(sec.key,item,chipRow);});
    chipRow.appendChild(chip);
  });
  wrap.appendChild(chipRow);
  var ic=document.createElement('div');
  rows.forEach(function(r){ic.appendChild(makeItemRow(sec.key,r));});
  wrap.appendChild(ic);
  var addBtn=document.createElement('button');addBtn.className='add-btn';addBtn.textContent='+ Add item';
  addBtn.addEventListener('click',function(){
    var nr={id:uid(),name:'',qty:'',unit:'',note:'',custom:true};
    sectionData[sec.key].push(nr);ic.appendChild(makeItemRow(sec.key,nr));updateBadgeEl(sec.key);hasProgress=true;
  });
  wrap.appendChild(addBtn);
  return wrap;
}

// ── makeItemRow ────────────────────────────────────────────────────────────────
function makeItemRow(key,row) {
  var div=document.createElement('div');div.className='item-row';div.id='row-'+row.id;
  var top=document.createElement('div');top.className='item-top';
  if(row.custom){
    var ni=document.createElement('input');ni.type='text';ni.className='item-name-input';ni.placeholder='Item name';ni.value=row.name;
    ni.addEventListener('input',function(e){row.name=e.target.value;});top.appendChild(ni);
  } else {
    var ns=document.createElement('div');ns.style.flex='1';
    ns.innerHTML='<div class="item-name">'+row.name+'</div>'+(row.unit?'<div class="item-unit">per '+row.unit+'</div>':'');
    top.appendChild(ns);
  }
  // qty — for sqft items auto-populate
  var qi=document.createElement('input');qi.type='number';qi.inputMode='decimal';qi.className='qty-input';qi.placeholder='Qty';qi.value=row.qty;
  if(row.sqft){
    qi.className='qty-input sqft-auto-qty';qi.dataset.rowid=row.id;qi.dataset.autoset=row.qty?'false':'true';
    if(!row.qty){var sqft=getSqft();if(sqft){qi.value=sqft;row.qty=String(sqft);qi.dataset.autoset='true';}}
    qi.addEventListener('input',function(e){row.qty=e.target.value;qi.dataset.autoset='false';});
  } else {
    qi.addEventListener('input',function(e){row.qty=e.target.value;});
  }
  top.appendChild(qi);
  var rm=document.createElement('button');rm.className='rm-btn';rm.innerHTML='&times;';
  rm.addEventListener('click',function(){
    sectionData[key]=sectionData[key].filter(function(r){return r.id!==row.id;});div.remove();updateBadgeEl(key);
    document.querySelectorAll('.chip').forEach(function(c){if(c.textContent.replace('\u2713 ','')===row.name){c.classList.remove('on');c.textContent=row.name;}});
  });
  top.appendChild(rm);div.appendChild(top);
  // sub-options for special items
  var sub=makeSubOptions(row);if(sub)div.appendChild(sub);
  var ni2=document.createElement('input');ni2.type='text';ni2.className='note-input';ni2.placeholder='Note (optional)';ni2.value=row.note;
  ni2.addEventListener('input',function(e){row.note=e.target.value;});div.appendChild(ni2);
  return div;
}

      var b=document.createElement('button');b.className='chip'+(st.bwidth===w?' on':'');b.textContent=w;b.style.fontSize='12px';
      b.addEventListener('click',function(){st.bwidth=w;opts.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x.textContent===w);});});
      opts.appendChild(b);
    });
    box.appendChild(opts);return box;

  if(row.name==='Toilet Seat'){
    var box=document.createElement('div');box.className='sub-options';

// ── Toggle item ────────────────────────────────────────────────────────────────
function toggleItem(key,itemDef,chipRow) {
  var name=itemDef.n;
  var rows=sectionData[key];
  var ex=rows.find(function(r){return r.name===name;});
  if(ex){
    sectionData[key]=rows.filter(function(r){return r.id!==ex.id;});
    var el=document.getElementById('row-'+ex.id);if(el)el.remove();
  } else {
    var nr={id:uid(),name:name,qty:'',unit:itemDef.unit||'',note:'',sqft:!!itemDef.sqft};
    sectionData[key].push(nr);
    var ic=chipRow.nextElementSibling;if(ic)ic.appendChild(makeItemRow(key,nr));
  }
  chipRow.querySelectorAll('.chip').forEach(function(c){
    var lbl=c.textContent.replace('\u2713 ','');
    if(lbl===name){var on=sectionData[key].some(function(r){return r.name===name;});c.classList.toggle('on',on);c.textContent=(on?'\u2713 ':'')+name;}
  });
  updateBadgeEl(key);updateCount();hasProgress=true;
}

function toggleSec(key,card){
  openSections[key]=!openSections[key];
  var body=document.getElementById('body-'+key)||card.querySelector('.acc-body');
  var head=card.querySelector('.acc-head');var chev=card.querySelector('.chevron');
  if(body)body.classList.toggle('open',openSections[key]);
  if(head)head.classList.toggle('open',openSections[key]);
  if(chev)chev.innerHTML=openSections[key]?'&#9652;':'&#9662;';
}

function updateBadgeEl(key){
  var badge=document.getElementById('badge-'+key);if(!badge)return;
  var count=(sectionData[key]||[]).length;
  if(key==='doors'){count+=['slab','sixPanel','twoPanel'].filter(function(k){return doorSubs[k].qty&&parseInt(doorSubs[k].qty)>0;}).length;}
  if(key==='wallprep'&&wallPrepSel)count++;
  if(key==='exterior'){if(comboDoor.active)count++;if(resDoor.active)count++;}
  badge.textContent=count;badge.style.display=count?'inline-block':'none';
}

function updateCount(){
  var total=Object.values(sectionData).flat().length;
  if(wallPrepSel)total++;
  ['slab','sixPanel','twoPanel'].forEach(function(k){if(doorSubs[k].qty&&parseInt(doorSubs[k].qty)>0)total++;});
  if(comboDoor.active)total++;if(resDoor.active)total++;
  var dot=document.getElementById('header-dot');if(dot)dot.classList.toggle('on',total>0);
  document.getElementById('item-count').textContent=total>0?total+' item'+(total!==1?'s':'')+' noted':'';
}

// ── Export ─────────────────────────────────────────────────────────────────────
function buildExportText(){
  var sqft=(job.length&&job.width)?Math.round(parseFloat(job.length)*parseFloat(job.width)):null;
  var out='BARRWOOD SERVICES - REFURB WALK-THROUGH v2\n';
  out+='Estimate #: '+job.estimate+'\n'+'-'.repeat(40)+'\n';
  out+='Address: '+(job.address||'-')+'  |  Unit: '+(job.unit||'-')+'\n';
  out+='Date: '+(job.date||'-')+'\n';
  if(sqft)out+='Sq Ft: '+sqft+' ('+job.length+' x '+job.width+')\n';
  out+='Paint Color: '+job.paintColor+'\n\n';
  SECTIONS.filter(function(s){return s.key!=='jobinfo';}).forEach(function(sec){
    var lines=[];
    if(sec.key==='wallprep'&&wallPrepSel){
      var opt=PREP_OPTS.find(function(o){return o.key===wallPrepSel;});
      if(opt)lines.push('  Wall Prep: '+opt.label+' ('+wallPrepPrices[wallPrepSel]+')');
    }
    if(sec.key==='doors'){
      [{key:'slab',label:'Slab'},{key:'sixPanel',label:'6 Panel'},{key:'twoPanel',label:'2 Panel'}].forEach(function(d){
        if(doorSubs[d.key].qty&&parseInt(doorSubs[d.key].qty)>0)
          lines.push('  Interior Door ('+d.label+')  x'+doorSubs[d.key].qty+'  '+doorSubs[d.key].color+(doorSubs.slab.note?'  - '+doorSubs.slab.note:''));
      });
    }
    if(sec.key==='exterior'){
      if(comboDoor.active)lines.push('  Door Combo  '+comboDoor.width+'" w x '+comboDoor.height+'" h  Jamb: '+comboDoor.jamb+'  Swing: '+comboDoor.swing+(comboDoor.note?'  - '+comboDoor.note:''));
      if(resDoor.active)lines.push('  Residential Door  '+resDoor.width+'" wide  Jamb: '+resDoor.jamb+'  Swing: '+resDoor.swing+(resDoor.note?'  - '+resDoor.note:''));
    }
    (sectionData[sec.key]||[]).forEach(function(r){
      var st=getSubState(r.id);
      var l='  '+(r.name||'(unnamed)');
      if(r.qty)l+='  x'+r.qty+(r.unit?' '+r.unit:'');
      if(st.size)l+='  ['+st.size+']';
      if(st.lftype)l+='  ['+st.lftype+']';
      if(st.bwidth)l+='  ['+st.bwidth+']';
      if(st.tsshape)l+='  ['+st.tsshape+']';
      if(r.note)l+='  - '+r.note;
      lines.push(l);
    });
    if(lines.length){out+='-- '+sec.label.toUpperCase()+' --\n';lines.forEach(function(l){out+=l+'\n';});out+='\n';}
  });
  if(job.interiorNotes)out+='INTERIOR NOTES:\n'+job.interiorNotes+'\n\n';
  if(job.exteriorNotes)out+='EXTERIOR NOTES:\n'+job.exteriorNotes+'\n';
  if(photos.length)out+='\nPHOTOS: '+photos.length+' photo'+(photos.length!==1?'s':'')+' attached\n';
  return out;
}

function tryOpenExport(){
  if(!job.estimate){
    openSections.jobinfo=true;render();
    setTimeout(function(){
      var f=document.getElementById('f-estimate');var w=document.getElementById('est-warn');
      if(f){f.classList.add('shake');f.focus();setTimeout(function(){f.classList.remove('shake');},500);}
      if(w)w.classList.add('show');
    },50);return;
  }
  document.getElementById('export-pre').textContent=buildExportText();
  var eps=document.getElementById('export-photo-section');
  var epg=document.getElementById('export-photo-grid');
  if(photos.length){
    eps.style.display='block';epg.innerHTML='';
    photos.forEach(function(p){var img=document.createElement('img');img.src=p.src;epg.appendChild(img);});
  } else { eps.style.display='none'; }
  document.getElementById('export-overlay').classList.add('open');
}

  var to=document.getElementById('email-to').value.trim();
  var subject=encodeURIComponent('Refurb Walk-Through - Est. #'+job.estimate+(job.address?' | '+job.address:''));
  var body=encodeURIComponent(buildExportText());
  window.location.href='mailto:'+to+'?subject='+subject+'&body='+body;
});
document.getElementById('btn-copy').addEventListener('click',function(){
  var text=buildExportText();var btn=this;
  var finish=function(){btn.textContent='Copied!';btn.classList.add('copied');setTimeout(function(){btn.textContent='Copy to clipboard';btn.classList.remove('copied');},2000);};
  if(navigator.clipboard)navigator.clipboard.writeText(text).then(finish).catch(function(){fallbackCopy(text,finish);});
  else fallbackCopy(text,finish);
});
function fallbackCopy(text,cb){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);cb();}
