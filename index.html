<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BarrWood">
  <meta name="theme-color" content="#12283c">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>BarrWood Services</title>
  <style>
    :root {
      --navy: #12283c;
      --blue: #2e6da4;
      --blue-mid: #3b7fb8;
      --blue-light: #6fa8d6;
      --green: #2e9e52;
      --green-light: #3dbf65;
      --green-pale: #0a2a14;
      --blue-pale: #1b3e5c;
      --surface: #14304a;
      --card: #b8b8b8;
      --border: #3e6e96;
      --text: #ffffff;
      --text-mid: #ffffff;
      --text-light: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(180deg, #16324a 0%, #2a5f88 100%); color: var(--text); max-width: 600px; margin: 0 auto; min-height: 100vh; }

    #app-header { background: linear-gradient(160deg, #12283c 0%, #2e6da4 60%, #3b7fb8 100%); position: sticky; top: 0; z-index: 100; box-shadow: 0 3px 20px rgba(0,0,0,.6); }
    .header-inner { padding: 14px 16px 0; }
    .header-top { display: flex; align-items: center; gap: 14px; padding-bottom: 10px; }
    .logo-circle { width: 62px; height: 62px; border-radius: 14px; flex-shrink: 0; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.15); overflow: hidden; }
    .logo-circle img { width: 60px; height: 60px; object-fit: cover; }
    .brand { flex: 1; }
    .brand-name { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: -0.5px; line-height: 1.1; }
    .brand-sub { font-size: 11px; color: rgba(255,255,255,.45); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 2px; }
    .header-btns { display: flex; gap: 8px; flex-shrink: 0; }
    #btn-new { background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.2); color: rgba(255,255,255,.85); border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    #btn-export { background: linear-gradient(135deg, var(--green) 0%, var(--green-light) 100%); border: none; color: #fff; border-radius: 10px; padding: 9px 18px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit; box-shadow: 0 2px 8px rgba(46,158,82,.4); }
    .header-bar { background: rgba(0,0,0,.2); border-top: 1px solid rgba(255,255,255,.08); padding: 7px 16px; display: flex; align-items: center; gap: 8px; }
    #item-count { font-size: 12px; color: rgba(255,255,255,.5); flex: 1; }
    .header-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-light); display: none; }
